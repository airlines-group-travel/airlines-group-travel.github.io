{%- comment -%}
  ONE JSON-LD block for the whole page, built entirely from _config.yml and the
  page's own front matter. There must never be a second <script type="application/ld+json">
  anywhere on the site — one graph per page is the rule.

  Design notes (deliberate, please do not "improve" these):
   * The Organization @id is the MAIN SITE's organization fragment, not this
     domain's. Same @id on both properties = search engines read one company,
     not two. This is the entire point of publishing this page.
   * Blog posts emit BlogPosting with real dates from front matter. Never
     hard-code a date here - that is defect #4 on the main site.
   * No AggregateRating / Review - self-serving review markup risks a manual action.
   * No Offer / price / priceRange - quote-only business, no published fares.
   * Every string runs through Liquid's `jsonify`, which quotes and escapes it.
     Never hand-wrap a value in quotes here - jsonify already does.
{%- endcomment -%}
{%- assign org_id  = site.main_site | append: "/#organization" -%}
{%- assign logo_id = site.main_site | append: "/#logo" -%}
{%- assign site_id = "/#website" | absolute_url -%}
{%- assign this_url = page.url | replace:'index.html','' | absolute_url -%}
{%- assign page_id = this_url | append: "#webpage" -%}
{%- assign blog_url = "/blog/" | absolute_url -%}
{%- if page.collection == 'blog' -%}
  {%- assign post_image = page.image | absolute_url -%}
{%- endif -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ org_id | jsonify }},
      "name": {{ site.title | jsonify }},
      "legalName": {{ site.legal_name | jsonify }},
      "url": {{ site.main_site | append: "/" | jsonify }},
      "description": {{ site.description | strip_newlines | strip | jsonify }},
      "foundingDate": {{ site.founding_year | jsonify }},
      "logo": {
        "@type": "ImageObject",
        "@id": {{ logo_id | jsonify }},
        "url": {{ site.logo_path | absolute_url | jsonify }},
        "contentUrl": {{ site.logo_path | absolute_url | jsonify }},
        "width": {{ site.logo_width }},
        "height": {{ site.logo_height }},
        "caption": {{ site.title | jsonify }}
      },
      "image": { "@id": {{ logo_id | jsonify }} },
      {%- if site.show_address %}
      "address": {
        "@type": "PostalAddress",
        "streetAddress": {{ site.street | jsonify }},
        "addressLocality": {{ site.locality | jsonify }},
        "addressRegion": {{ site.region | jsonify }},
        "postalCode": {{ site.postal_code | jsonify }},
        "addressCountry": {{ site.country | jsonify }}
      },
      {%- endif %}
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "telephone": {{ site.phone | jsonify }},
        "email": {{ site.email | jsonify }},
        "availableLanguage": [
          {%- for l in site.languages -%}
          {{ l.name | jsonify }}{% unless forloop.last %},{% endunless %}
          {%- endfor -%}
        ],
        "areaServed": "Worldwide"
      },
      "sameAs": [
        {{ site.main_site | jsonify }},
        {{ site.url | jsonify }}{% for p in site.profiles %},
        {{ p.url | jsonify }}{% endfor %}
      ]
    },
    {
      "@type": "WebSite",
      "@id": {{ site_id | jsonify }},
      "url": {{ site.url | append: "/" | jsonify }},
      "name": {{ site.title | append: " — Official Profile" | jsonify }},
      "inLanguage": "en",
      "publisher": { "@id": {{ org_id | jsonify }} },
      "about":     { "@id": {{ org_id | jsonify }} }
    },
    {
      {%- if page.collection == 'blog' %}
      "@type": "WebPage",
      {%- elsif page.url == '/blog/' %}
      "@type": ["CollectionPage", "WebPage"],
      {%- else %}
      "@type": ["WebPage", "ProfilePage"],
      {%- endif %}
      "@id": {{ page_id | jsonify }},
      "url": {{ this_url | jsonify }},
      "name": {{ page.meta_title | default: page.title | default: site.title | jsonify }},
      "description": {{ page.description | default: site.description | strip_newlines | strip | jsonify }},
      "inLanguage": "en",
      "isPartOf": { "@id": {{ site_id | jsonify }} },
      {%- if page.collection == 'blog' %}
      "primaryImageOfPage": { "@id": {{ this_url | append: "#primaryimage" | jsonify }} },
      "breadcrumb": { "@id": {{ this_url | append: "#breadcrumb" | jsonify }} },
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }}
      {%- else %}
      "about":      { "@id": {{ org_id | jsonify }} },
      "mainEntity": { "@id": {{ org_id | jsonify }} },
      "primaryImageOfPage": { "@id": {{ logo_id | jsonify }} }
      {%- endif %}
    }
    {%- if page.url == '/blog/' -%}
    {%- assign posts = site.blog | where_exp: "p", "p.published != false" | sort: "date" | reverse %},
    {
      "@type": "Blog",
      "@id": {{ blog_url | append: "#blog" | jsonify }},
      "url": {{ blog_url | jsonify }},
      "name": {{ site.blog_title | jsonify }},
      "description": {{ site.blog_intro | strip_newlines | strip | jsonify }},
      "inLanguage": "en",
      "publisher": { "@id": {{ org_id | jsonify }} }
    },
    {
      "@type": "ItemList",
      "@id": {{ blog_url | append: "#itemlist" | jsonify }},
      "itemListOrder": "https://schema.org/ItemListOrderDescending",
      "numberOfItems": {{ posts.size }},
      "itemListElement": [
        {%- for post in posts %}
        {
          "@type": "ListItem",
          "position": {{ forloop.index }},
          "url": {{ post.url | absolute_url | jsonify }},
          "name": {{ post.title | jsonify }}
        }{% unless forloop.last %},{% endunless %}
        {%- endfor %}
      ]
    }
    {%- endif -%}
    {%- if page.collection == 'blog' -%},
    {
      "@type": "BlogPosting",
      "@id": {{ this_url | append: "#article" | jsonify }},
      "headline": {{ page.title | truncate: 110 | jsonify }},
      "description": {{ page.description | strip_newlines | strip | jsonify }},
      "url": {{ this_url | jsonify }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.last_modified_at | default: page.date | date_to_xmlschema | jsonify }},
      "inLanguage": "en",
      "isPartOf":  { "@id": {{ blog_url | append: "#blog" | jsonify }} },
      "mainEntityOfPage": { "@id": {{ page_id | jsonify }} },
      "author":    { "@id": {{ org_id | jsonify }} },
      "publisher": { "@id": {{ org_id | jsonify }} },
      "image": { "@id": {{ this_url | append: "#primaryimage" | jsonify }} }
    },
    {
      "@type": "ImageObject",
      "@id": {{ this_url | append: "#primaryimage" | jsonify }},
      {%- if page.image %}
      "url": {{ post_image | jsonify }},
      "contentUrl": {{ post_image | jsonify }},
      "caption": {{ page.image_alt | default: page.title | jsonify }}
      {%- else %}
      "url": {{ site.logo_path | absolute_url | jsonify }},
      "contentUrl": {{ site.logo_path | absolute_url | jsonify }},
      "width": {{ site.logo_width }},
      "height": {{ site.logo_height }},
      "caption": {{ site.title | jsonify }}
      {%- endif %}
    },
    {
      "@type": "BreadcrumbList",
      "@id": {{ this_url | append: "#breadcrumb" | jsonify }},
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ "/" | absolute_url | jsonify }} },
        { "@type": "ListItem", "position": 2, "name": {{ site.blog_title | jsonify }}, "item": {{ blog_url | jsonify }} },
        { "@type": "ListItem", "position": 3, "name": {{ page.title | jsonify }} }
      ]
    }
    {%- endif %}
  ]
}
</script>
